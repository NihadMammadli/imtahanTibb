<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ŞD Suallar</title>
  <meta name="description" content="Şüa diaqnostikası üzrə 522 test sualı: bloklarla məşq, imtahan rejimi və səhvlərin təkrarı.">
  <meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1218" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    try {
      var t = localStorage.getItem('sd.theme.v1');
      if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t);
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="loading">Suallar yüklənir…</div>
  </main>
  <dialog id="dlg"></dialog>
  <div id="print-root"></div>
  <script src="assets/app.js" defer></script>
</body>
</html>
